version: "0.0.1"

services:
  # ---------------------------------------------
  # 1. Your Authentication Microservice
  # ---------------------------------------------
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - redis
    command:
      - uvicorn app.app:app --host 0.0.0.0 --port 8000 --reload
  
  # ---------------------------------------------
  # 2. The Redis Cache
  # ---------------------------------------------
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
